name: Secret Scanner

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  trufflehog:
    name: TruffleHog OSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check commit range & skip upstream merges
        id: filter
        run: |
          SKIP="false"
          BASE_COMMIT=""
          HEAD_COMMIT="HEAD"

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_COMMIT="${{ github.event.pull_request.base.sha }}"
            HEAD_COMMIT="${{ github.event.pull_request.head.sha }}"

            PR_SOURCE="${{ github.event.pull_request.head.repo.full_name }}"
            if [ "$PR_SOURCE" = "end-4/dots-hyprland" ]; then
              echo "PR originates from upstream repository. Skipping scan."
              SKIP="true"
            fi
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE_COMMIT="$BEFORE"
            else
              if git rev-parse HEAD~1 >/dev/null 2>&1; then
                BASE_COMMIT="HEAD~1"
              fi
            fi

            # Check if current commit is a merge commit from upstream
            if git rev-parse -q --verify HEAD^2 >/dev/null 2>&1; then
              COMMIT_MSG=$(git log -1 --pretty=%B)
              echo "Merge commit detected: $COMMIT_MSG"
              if echo "$COMMIT_MSG" | grep -Eiq "upstream|end-4|dots-hyprland"; then
                echo "Upstream merge detected. Skipping scan."
                SKIP="true"
              fi
            fi

            # Check if any commit in pushed range is an upstream merge
            if [ "$SKIP" = "false" ] && [ -n "$BASE_COMMIT" ]; then
              if git log "${BASE_COMMIT}..HEAD" --oneline | grep -Eiq "merge (remote-tracking )?branch ['\"]?upstream|merge branch .* of https://github.com/end-4"; then
                echo "Upstream merge in commit range detected. Skipping scan."
                SKIP="true"
              fi
            fi
          fi

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "base=$BASE_COMMIT" >> "$GITHUB_OUTPUT"
          echo "head=$HEAD_COMMIT" >> "$GITHUB_OUTPUT"

      - name: TruffleHog OSS
        if: steps.filter.outputs.skip != 'true'
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ steps.filter.outputs.base }}
          head: ${{ steps.filter.outputs.head }}
          extra_args: --results=verified,unverified --filter-entropy=3.0
